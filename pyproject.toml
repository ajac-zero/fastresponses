[project]
name = "fastresponses"
version = "0.1.0"
description = "Serve agent frameworks (Google ADK, Pydantic AI, LangGraph, OpenAI Agents SDK) over the Open Responses API"
readme = "README.md"
authors = [
    { name = "A8065384", email = "anibal.angulo.cardoza@banorte.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["open-responses", "openai", "responses-api", "agents", "adk", "pydantic-ai", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.50.2",
]

[project.urls]
Homepage = "https://github.com/ajac-zero/fastresponses"
Repository = "https://github.com/ajac-zero/fastresponses"
Issues = "https://github.com/ajac-zero/fastresponses/issues"
Changelog = "https://github.com/ajac-zero/fastresponses/releases"
Specification = "https://www.openresponses.org"

[project.scripts]
fastresponses = "fastresponses:main"

[project.optional-dependencies]
adk = [
    "google-adk>=2.3.0",
]
pydantic-ai = [
    "pydantic-ai-slim>=2.6.0",
]
langgraph = [
    "langchain-core>=1.4.8",
    "langgraph>=1.2.8",
]
openai-agents = [
    "openai-agents>=0.18.0",
]
otel = [
    "opentelemetry-api>=1.42.1",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "opentelemetry-sdk>=1.42.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "compliance: runs the official Open Responses compliance suite (needs bun + network on first run)",
]
